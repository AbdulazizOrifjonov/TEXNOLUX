services:
  - type: web
    name: texnolux
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: node tools/telegram_product_bot.js
    healthCheckPath: /bot-api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: "@ReferalPeople_bot"
